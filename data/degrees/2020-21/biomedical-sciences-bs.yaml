# biomedical-sciences-bs.yaml — Biomedical Sciences, BS (2020-21)

id: biomedical-sciences-bs
label: "Biomedical Sciences (BS)"
degree_type: bachelor
total_credits: 119
term_type: semester
max_credits_per_term: 18
terms_count: 8

gen_ed:
  template: gen-ed-bachelor
  overrides:
    - category: scientific-technological
      _remove: true
    - category: math
      default: "GEMA 1200"

categories:
