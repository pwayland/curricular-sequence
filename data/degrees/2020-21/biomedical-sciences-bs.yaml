    label: "Major Requirements"
    # 17 courses; catalog total implies ~56 cr (some 4-cr lab courses)
    credits: 56
    rule: prereq-order
    category_type: major
    courses:
      - "BMSC 2210"
      - "BMSC 3011"
      - "BMSC 3012"
      - "BMSC 4015"
      - "BMSC 4020"
      - "BIOL 1101"
      - "BIOL 1102"
      - "BIOL 1103"
      - "BIOL 1104"
      - "BIOL 3105"
      - "CHEM 1111"
      - "CHEM 2212"
      - "CHEM 2221"
      - "CHEM 2222"
      - "MATH 1500"
      - "PHYS 3001"
      - "PHYS 3002"

  - id: prescribed-distributive
    label: "Prescribed Distributive"
    credits: 12
    rule: pick
    pick_count: 4
    category_type: distributive
    options:
      - "BIOL 2153"
      - "BIOL 3405"
      - "BIOL 4305"
      - "BIOL 4405"
      - "BIOL 4494"
      - "BIOL 4604"
      - "BIOL 4905"
      - "CHEM 3320"
      - "ENGL 2076"
      - "ENGL 3030"
      - "MATH 2251"

  - id: electives
    label: "Elective Courses"
    credits: 6
    rule: open-elective
    category_type: elective

# Credit check: 45 (gen-ed) + 56 (major) + 12 (distributive) + 6 (electives) = 119

