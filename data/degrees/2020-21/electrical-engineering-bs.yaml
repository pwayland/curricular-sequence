# electrical-engineering-bs.yaml — Electrical Engineering, BS (2020-21)

id: electrical-engineering-bs
label: "Electrical Engineering (BS)"
degree_type: bachelor
total_credits: 141
term_type: semester
max_credits_per_term: 18
terms_count: 8

gen_ed:
  template: gen-ed-bachelor
  overrides:
    - category: math
      _remove: true
    - category: info-computing
      _remove: true
    - category: entrepreneurial-culture
      _remove: true
    - category: scientific-technological
      _remove: true
    - category: health-quality
      _remove: true
    - category: philosophical-aesthetic
      credits: 3
      subcategories:
        - id: ethics
          label: "Ethical Component"
          credits: 3
          rule: fixed
          courses: ["GEPE 4040"]
          default: "GEPE 4040"
    - category: historical-social
      credits: 3
      subcategories:
        - id: historical
          label: "Historical Component"
          credits: 3
          rule: pick
          options: ["GEHS 2010", "GEHS 3020", "GEHS 3050", "GEHS 4030"]
          default: "GEHS 2010"

