# forensic-biology-bs.yaml — Forensic Biology, BS (2020-21)

id: forensic-biology-bs
label: "Forensic Biology (BS)"
degree_type: bachelor
total_credits: 128
term_type: semester
max_credits_per_term: 18
terms_count: 8

gen_ed:
  template: gen-ed-bachelor
  overrides:
    - category: scientific-technological
      _remove: true
    - category: math
      default: "GEMA 1200"

categories:
  - id: major-requirements
    label: "Major Requirements"
    credits: 30
    rule: prereq-order
    category_type: major
    courses:
      - "FORS 2000"
      - "FORS 3010"
      - "FORS 3970"
      - "FORS 4421"
      - "FORS 4511"
      - "FORS 4512"
      - "FORS 4910"
      - "FORS 4960"
      - "CJUS 1000"
      - "CJUS 3025"

  - id: related-requirements
    label: "Related Requirements"
    credits: 45
    rule: prereq-order
    category_type: core
    courses:
      - "BIOL 1101"
      - "BIOL 1102"
      - "BIOL 1103"
      - "BIOL 1104"
      - "BIOL 1116"
      - "BIOL 2153"
      - "BIOL 3010"
      - "BIOL 3220"
      - "BIOL 4604"
      - "CHEM 1111"
      - "CHEM 2212"
      - "CHEM 2221"
      - "CHEM 2222"
      - "PHYS 3001"
      - "PHYS 3002"

  - id: math-option
    label: "Math Option"
    # MATH 1500 (4 cr) or MATH 1511+1512 (6 cr); simplified as pick 1
    credits: 4
    rule: pick
    pick_count: 1
    category_type: core
    options:
      - "MATH 1500"
      - "MATH 1511"

  - id: electives
    label: "Elective Courses"
    credits: 3
    rule: open-elective
    category_type: elective

# Credit check: 45 (gen-ed) + 30 (major) + 45 (related) + 4 (math) + 3 (electives) = 127
# Catalog states 128-129 cr; minor discrepancy from variable lab credits. Using 128.

