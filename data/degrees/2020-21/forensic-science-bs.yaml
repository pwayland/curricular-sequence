# forensic-science-bs.yaml — Forensic Science, BS (2020-21)

id: forensic-science-bs
label: "Forensic Science (BS)"
degree_type: bachelor
total_credits: 125
term_type: semester
max_credits_per_term: 18
terms_count: 8

gen_ed:
  template: gen-ed-bachelor
  overrides:
    - category: health-quality
      _remove: true
    - category: math
      default: "GEMA 1200"

categories:
  - id: major-requirements
    label: "Major Requirements"
    credits: 27
    rule: prereq-order
    category_type: major
    courses:
      - "CJUS 1000"
      - "CJUS 3025"
      - "FORS 2000"
      - "FORS 3970"
      - "FORS 4400"
      - "FORS 4421"
      - "FORS 4422"
      - "FORS 4910"
      - "FORS 4960"

  - id: related-requirements
    label: "Related Requirements"
    credits: 40
    rule: prereq-order
    category_type: core
    courses:
      - "BIOL 1101"
      - "BIOL 1103"
      - "BIOL 1116"
      - "CHEM 1111"
      - "CHEM 2212"
      - "CHEM 2221"
      - "CHEM 2222"
      - "CHEM 3320"
      - "CHEM 4220"
      - "MATH 1500"
      - "PHYS 3001"
      - "PHYS 3002"

  - id: electives
    label: "Elective Courses"
    credits: 3
    rule: open-elective
    category_type: elective

# Credit check: 45 (gen-ed) + 27 (major) + 40 (related) + 3 (electives) = 115 (category sum)
# Actual = 125 cr; some CHEM/PHYS/MATH courses are 4-5 cr. Category credits need verification.

