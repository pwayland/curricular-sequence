# natural-sciences-bs.yaml — Natural Sciences, BS (2020-21)

id: natural-sciences-bs
label: "Natural Sciences (BS)"
degree_type: bachelor
total_credits: 120
term_type: semester
max_credits_per_term: 18
terms_count: 8

gen_ed:
  template: gen-ed-bachelor
  overrides:
    - category: math
      default: "GEMA 1200"

categories:
  - id: core-requirements
    label: "Core Requirements"
    credits: 30
    rule: prereq-order
    category_type: core
    courses:
      - "BIOL 1101"
      - "BIOL 1102"
      - "BIOL 1103"
      - "BIOL 1104"
      - "MATH 1511"
      - "MATH 1512"
      - "CHEM 1111"
      - "CHEM 2212"
      - "PHYS 3001"
      - "PHYS 3002"

  - id: major-electives
    label: "Major Electives"
    # 30 cr from BIOL, CHEM, MATH, FORS, MASC, BIOT, MICR, EVSC, EVMA, TOXI, BMSC, BIPS, COMP;
    # minimum 12 cr at 3000/4000 level
    credits: 30
    rule: open-elective
    category_type: major

  - id: electives
    label: "Elective Courses"
    credits: 12
    rule: open-elective
    category_type: elective

# Credit check: 48 (gen-ed) + 30 (core) + 30 (major electives) + 12 (electives) = 120

